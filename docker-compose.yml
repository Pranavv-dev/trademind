services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Loopback-only: the API has no authentication, so it must never be
      # reachable from outside the host. Reach it over an SSH tunnel instead
      # (see SECURITY.md). Docker port publishing bypasses host firewalls like ufw.
      - "127.0.0.1:5000:5000"
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Loopback-only — tunnel in rather than exposing the dashboard. See SECURITY.md.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_WS_URL=ws://localhost:5000/ws/live

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trademind
      POSTGRES_USER: trademind
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trademind_dev}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: local debugging (psql) only. Never expose Postgres.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 100 --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      # Loopback-only: Redis holds the live Kite access token. Never expose it.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
